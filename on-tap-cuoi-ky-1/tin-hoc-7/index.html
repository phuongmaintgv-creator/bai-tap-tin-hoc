<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ôn tập cuối học kì I — Tin học 7</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#13235e">
<style>
:root{--bg:#0b1640;--bg2:#13235e;--card:#ffffff;--ink:#14204a;--mute:#5b6690;--acc:#ffc93c;--ok:#1fa463;--bad:#e5484d;--pri:#2f6bff;--line:#d9def0}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#2a4bb8 0,var(--bg) 60%);color:#fff;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header .grow{min-width:220px}
header h1{font-size:clamp(20px,3.2vw,34px);margin:0;letter-spacing:.5px}
header .sub{color:#c9d3ff;font-size:14px}
.pill{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-size:14px}
.identity{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.identity .pill{font-size:12px;padding:4px 10px}
.ai{margin-top:10px}.aib{background:none;border:1px solid #c8d2f0;border-radius:999px;padding:5px 12px;font-size:14px;color:#2f4a9a;cursor:pointer;font-family:inherit}.aib:disabled{opacity:.6}.ait{font-size:15px;color:#33406b;margin-top:6px;line-height:1.45}
.tacquyen{font-size:11px;color:#9fb0e6;margin-top:6px}
.grow{flex:1}
.card{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.25);margin-top:16px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#eef1fb;color:var(--ink)}
.btn.acc{background:var(--acc);color:#1b1b1b}
.btn.ok{background:var(--ok)}
.btn.sm{padding:8px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
input[type=text],textarea{font-size:18px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;width:100%;font-family:inherit}
textarea{min-height:150px}
label{font-weight:600}
.vong{border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#f7f9ff}
.vong b{display:block;font-size:18px;margin-bottom:4px}
.vong.on{border-color:var(--pri);background:#e9f0ff}
.q{font-size:clamp(19px,2.4vw,26px);font-weight:600;line-height:1.4;margin:6px 0 14px}
.tag{display:inline-block;max-width:100%;white-space:normal;background:#eef1fb;color:var(--mute);border-radius:8px;padding:3px 8px;font-size:13px;margin-right:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font-size:clamp(17px,2vw,21px);text-align:left;cursor:pointer;color:var(--ink);font-family:inherit}
.opt:hover{border-color:var(--pri)}
.opt .k{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#eef1fb;margin-right:10px;font-weight:700}
.opt.ok{background:#e3f7ec;border-color:var(--ok)}
.opt.bad{background:#fde8e8;border-color:var(--bad)}
.timer{height:10px;background:#eef1fb;border-radius:99px;overflow:hidden;margin:8px 0 14px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--acc),var(--bad));width:100%;transition:width .2s linear}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:17px}
.fb.ok{background:#e3f7ec;color:#0d5b34}
.fb.bad{background:#fde8e8;color:#8a1c1f}
.src{color:var(--mute);font-size:13px;margin-top:6px}
.tf{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding:10px 0;font-size:clamp(16px,1.9vw,20px)}
.tf .bt{display:flex;gap:6px}
.tf button{min-width:58px}
.sel{outline:3px solid var(--pri)}
.m-col{display:flex;flex-direction:column;gap:10px}
.chip{border:2px solid var(--line);border-radius:12px;padding:12px;background:#fff;cursor:pointer;font-size:clamp(15px,1.8vw,19px);color:var(--ink);text-align:left;font-family:inherit}
.chip.pick{border-color:var(--pri);background:#e9f0ff}
.chip.done{border-color:var(--ok);background:#e3f7ec;cursor:default}
.chip.wrong{animation:sh .35s;border-color:var(--bad)}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.cat{border:2px dashed #a9b4dc;border-radius:14px;padding:10px;min-height:120px;background:#f7f9ff;cursor:pointer}
.cat h4{margin:0 0 8px;font-size:17px}
.cat .chip{margin:4px 0;width:100%}
.pool{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.sortl{display:flex;flex-direction:column;gap:8px}
.sortl .it{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;font-size:clamp(16px,1.9vw,20px)}
.sortl .it span{flex:1}
.sortl .it.ok{border-color:var(--ok);background:#e3f7ec}
.sortl .it.bad{border-color:var(--bad);background:#fde8e8}
.score{font-size:64px;font-weight:800;color:var(--pri);text-align:center}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#eef1fb}
.teams{display:flex;gap:8px;flex-wrap:wrap}
.team{background:rgba(255,255,255,.14);border-radius:12px;padding:6px 12px;font-weight:700}
.team.now{background:var(--acc);color:#1b1b1b}
.draft{font-size:12px;color:#c9d3ff;margin-top:18px;text-align:center}
.hide{display:none!important}
.prog{font-size:14px;color:var(--mute)}
.big-emoji{font-size:54px;text-align:center}
@media (max-width:600px){.wrap{padding:10px}.card{padding:14px}}
</style>
<style id="chu-to">/* CHỮ TO — bài ôn tập (10/11/2026) */
header h1{font-size:clamp(24px,3.8vw,42px)}header .sub{font-size:17px}.pill{font-size:16px}.identity .pill{font-size:14px}
.card{font-size:18px}
.btn{font-size:20px;padding:14px 22px}.btn.sm{font-size:16px;padding:10px 14px}
input[type=text],textarea{font-size:20px}
.vong b{font-size:22px}.vong{font-size:17px}
.q{font-size:clamp(23px,3.3vw,40px);line-height:1.35}
.tag{font-size:15px}
.opts{gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.opt{font-size:clamp(19px,2.5vw,29px);padding:16px 18px;line-height:1.3}.opt .k{width:40px;height:40px;font-size:20px}
.fb{font-size:20px}.src{font-size:15px}.prog{font-size:17px}
.tf{font-size:clamp(18px,2.4vw,27px)}.tf button{min-width:70px;font-size:18px}
.chip{font-size:clamp(17px,2.2vw,25px);padding:14px}
.cat h4{font-size:21px}
.sortl .it{font-size:clamp(17px,2.2vw,25px);padding:10px 12px}
.team{font-size:18px;padding:8px 14px}
.ait{font-size:17px}.aib{font-size:16px}
table{font-size:16px}
@media (max-width:600px){.q{font-size:21px}.opt{font-size:18px}.opts{grid-template-columns:1fr}.tf{font-size:17px}.chip{font-size:16px}}
</style>
</head>

<div class="wrap">
  <header>

/* chọn câu: chia đều theo bài để lượt nào cũng phủ đủ nội dung */
function pick(list, n) {
  if (!n || n >= list.length) return shuf(list);
  const by = {}; list.forEach(x => (by[x.bai || "_"] = by[x.bai || "_"] || []).push(x));
  const keys = Object.keys(by).map(k => (by[k] = shuf(by[k]), k));
  const out = []; let i = 0;
  while (out.length < n) { const k = keys[i % keys.length]; if (by[k].length) out.push(by[k].shift()); i++; if (i > n * 20) break; }
  return shuf(out);
}

function baoMa(t) { const e = $("#maLoi"); e.textContent = t; e.classList.remove("hide"); $("#ma").style.borderColor = "var(--bad)"; $("#ma").focus(); }
function start(vongs, het, ma, doi) {
  const list = {};
  vongs.forEach(k => list[k] = het ? shuf(BAI[k]) : pick(BAI[k], BAI.so[k]));
  S = { vongs, list, vi: 0, qi: 0, ma, doi: doi.length >= 2 ? doi.map(t => ({ ten: t, d: 0 })) : null, turn: 0,
        diem: {}, toi: {}, sai: [], bat: Date.now(), het };
  vongs.forEach(k => { S.diem[k] = 0; S.toi[k] = 0; });
  intro();
}

function teamBar() {
  const b = $("#teamBar");
  if (!S.doi) { b.classList.add("hide"); return; }

  app.innerHTML = `<div class="card" style="text-align:center"><div class="big-emoji">${v.icon}</div><h2>${v.ten}</h2><p style="font-size:18px">${v.mo} — ${S.list[k].length} câu</p><button class="btn acc" id="go">Vào vòng</button></div>`;
  $("#go").onclick = () => { S.qi = 0; show(); };
}

function show() {
  const k = S.vongs[S.vi], it = S.list[k][S.qi];
  if (!it) { S.vi++; if (S.vi < S.vongs.length) intro(); else finish(); return; }
  teamBar();
  ({ mc: showMC, tf: showTF, th: showTH, tl: showTL })[k](it);
}
function head(k, it) {
  const n = S.list[k].length, who = S.doi ? ` · Lượt: <b>${esc(S.doi[S.turn].ten)}</b>` : "";
  return `<div class="row"><span class="prog">${VONG.find(x => x.k === k).ten} · Câu ${S.qi + 1}/${n}${who}</span><span class="grow"></span>${BAI.an_nhan ? "" : (it.bai ? `<span class="tag">${esc(it.bai)}</span>` : "") + (it.muc ? `<span class="tag">${esc(it.muc)}</span>` : "")}</div>`;
}
function nextBtn() { return `<div class="row" style="margin-top:14px"><button class="btn" id="nx">Câu tiếp ➜</button></div>`; }
function bindNext() { const b = $("#nx"); b.onclick = () => { nextTurn(); S.qi++; show(); }; b.focus(); }

/* ---------- đồng hồ ---------- */
let T = null;
function startTimer(sec, onEnd) {
  stopTimer(); const bar = $("#tbar"), t0 = Date.now();
  T = setInterval(() => { const r = 1 - (Date.now() - t0) / (sec * 1000); if (bar) bar.style.width = Math.max(0, r * 100) + "%"; const tx = $("#tsec"); if (tx) tx.textContent = Math.max(0, Math.ceil(r * sec)) + " giây"; if (r <= 0) { stopTimer(); onEnd(); } }, 200);
}
function stopTimer() { if (T) clearInterval(T); T = null; }

/* ---------- AI: gợi ý trước khi chốt, giải thích sau khi chốt (chỉ khi mở trong Đấu trường và có mạng) ---------- */
const coAI = () => !!(window.google && google.script && google.script.run) && navigator.onLine;
const aiKhung = (id, nhan) => coAI() ? `<div class="ai" id="${id}"><button class="aib" type="button">${nhan}</button><div class="ait"></div></div>` : "";
function ganAI(id, ham, q) {
  const k = $("#" + id); if (!k) return;
  const b = k.querySelector(".aib"), t = k.querySelector(".ait");
  b.onclick = () => {
    b.disabled = true; b.textContent = "…";
    google.script.run.withSuccessHandler(r => { if (r && r.ok) { t.textContent = r.text; b.remove(); } else k.remove(); })
      .withFailureHandler(() => k.remove())[ham](Object.assign({ mon: BAI.mon, baiId: BAI.id, ma: S && S.ma || "" }, q));
  };
}

/* ---------- vòng 1: trắc nghiệm ---------- */

    <div class="timer"><i id="tbar"></i></div><div class="prog" id="tsec"></div>
    <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span>${esc(o.t)}</button>`).join("")}</div>${aiKhung("aiH", "💡 Gợi ý")}<div id="fb"></div></div>`;
  ganAI("aiH", "goiYOnTap", { cau: it.q, phuongAn: it.opts, dapAn: [it.opts[0]] });
  let done = false;
  const end = (i) => {
    if (done) return; done = true; stopTimer();

    const hb = $("#aiH .aib"); if (hb) $("#aiH").remove();

    ganAI("aiG", "giaiThichOnTap", { cau: it.q, phuongAn: it.opts, dapAn: [it.opts[0]], emChon: i != null ? opts[i].t : "" });
    bindNext();
  };
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => end(+b.dataset.i));
  startTimer(it.giay || BAI.giay_mc || 25, () => end(null));
}

/* ---------- vòng 2: đúng / sai ---------- */
function showTF(it) {
  const ys = it.y.map((y, i) => ({ t: y[0], d: y[1], g: y[2] || "", n: "abcd"[i] }));
  const ans = {};
  app.innerHTML = `<div class="card">${head("tf", it)}<div class="q">${esc(it.q)}</div>
    <div class="timer"><i id="tbar"></i></div><div class="prog" id="tsec"></div>
    <div id="tfl">${ys.map((y, i) => `<div class="tf" data-i="${i}"><div><b>${y.n})</b> ${esc(y.t)}<div class="src gx hide"></div></div><div class="bt"><button class="btn ghost sm" data-v="1">Đúng</button><button class="btn ghost sm" data-v="0">Sai</button></div></div>`).join("")}</div>
    ${aiKhung("aiH", "💡 Gợi ý")}<div class="row" style="margin-top:12px"><button class="btn ok" id="chk">Chốt đáp án</button></div><div id="fb"></div></div>`;

  }));

}

/* ---------- vòng 3: thực hành ---------- */
function showTH(it) {
  const box = `<div class="card">${head("th", it)}<div class="q">${esc(it.q)}</div><div id="th"></div><div id="fb"></div></div>`;
  app.innerHTML = box;
  ({ match: thMatch, cat: thCat, sort: thSort })[it.t](it, $("#th"));
}
function thDone(it, dat, toi, msg) {
  cong("th", dat / toi, 1);
  $("#fb").outerHTML = `<div class="fb ${dat === toi ? "ok" : "bad"}">${msg}${it.gt ? `<div>${esc(it.gt)}</div>` : ""}${it.src ? `<div class="src">📖 ${esc(it.src)}</div>` : ""}</div>` + nextBtn();

}
function thMatch(it, el) {
  const L = shuf(it.p.map((p, i) => ({ t: p[0], i }))), R = shuf(it.p.map((p, i) => ({ t: p[1], i })));
  el.innerHTML = `<p class="prog">Bấm một thẻ bên trái rồi bấm thẻ khớp bên phải.</p><div class="grid2"><div class="m-col" id="ml">${L.map(x => `<button class="chip" data-i="${x.i}">${esc(x.t)}</button>`).join("")}</div><div class="m-col" id="mr">${R.map(x => `<button class="chip" data-i="${x.i}">${esc(x.t)}</button>`).join("")}</div></div>`;
  let pick = null, sai = new Set(), xong = 0;
  el.querySelectorAll("#ml .chip").forEach(b => b.onclick = () => { if (b.classList.contains("done")) return; el.querySelectorAll("#ml .chip").forEach(x => x.classList.remove("pick")); b.classList.add("pick"); pick = b; });
  el.querySelectorAll("#mr .chip").forEach(b => b.onclick = () => {
    if (!pick || b.classList.contains("done")) return;
    if (pick.dataset.i === b.dataset.i) { pick.classList.remove("pick"); pick.classList.add("done"); b.classList.add("done"); pick = null; xong++;
      if (xong === it.p.length) { const d = it.p.length - sai.size; thDone(it, d, it.p.length, `Hoàn thành! Ghép đúng ngay lần đầu ${d}/${it.p.length} cặp.`); } }
    else { sai.add(pick.dataset.i); S.sai.push("Ghép: " + it.p[pick.dataset.i][0].slice(0, 40)); [pick, b].forEach(x => { x.classList.remove("wrong"); void x.offsetWidth; x.classList.add("wrong"); }); }
  });
}
function thCat(it, el) {
  const items = shuf(it.items.map((x, i) => ({ t: x[0], c: x[1], i })));
  const where = {};
  el.innerHTML = `<p class="prog">Bấm một thẻ rồi bấm vào ô đúng của nó. Xếp xong bấm «Kiểm tra».</p><div class="pool" id="pool"></div>
    <div class="cats">${it.cats.map((c, j) => `<div class="cat" data-c="${j}"><h4>${esc(c)}</h4><div class="in"></div></div>`).join("")}</div>
    <div class="row" style="margin-top:12px"><button class="btn ok" id="chk">Kiểm tra</button></div>`;
  let pick = null;
  const draw = () => {
    $("#pool").innerHTML = items.filter(x => where[x.i] == null).map(x => `<button class="chip ${pick === x.i ? "pick" : ""}" data-i="${x.i}">${esc(x.t)}</button>`).join("") || `<span class="prog">Đã xếp hết thẻ.</span>`;
    el.querySelectorAll(".cat").forEach(c => c.querySelector(".in").innerHTML = items.filter(x => where[x.i] === +c.dataset.c).map(x => `<button class="chip ${pick === x.i ? "pick" : ""}" data-i="${x.i}">${esc(x.t)}</button>`).join(""));
    el.querySelectorAll(".chip").forEach(b => b.onclick = e => { e.stopPropagation(); if (lock) return; pick = +b.dataset.i; draw(); });
  };
  let lock = false;
  el.querySelectorAll(".cat").forEach(c => c.onclick = () => { if (lock || pick == null) return; where[pick] = +c.dataset.c; pick = null; draw(); });
  draw();
  $("#chk").onclick = () => {
    if (items.some(x => where[x.i] == null)) { alert("Còn thẻ chưa xếp."); return; }
    lock = true; let d = 0;
    el.querySelectorAll(".cat .chip").forEach(b => { const x = items.find(y => y.i === +b.dataset.i); const ok = x.c === where[x.i]; if (ok) d++; else { S.sai.push("Phân loại: " + x.t.slice(0, 40)); b.textContent += " → " + it.cats[x.c]; } b.classList.add(ok ? "done" : "wrong"); b.style.background = ok ? "" : "#fde8e8"; });
    $("#chk").remove();
    thDone(it, d, items.length, `Xếp đúng ${d}/${items.length} thẻ.`);
  };
}
function thSort(it, el) {
  let ord = shuf(it.items.map((t, i) => ({ t, i })));
  if (ord.every((x, k) => x.i === k)) ord.reverse();
  const draw = (lock) => {
    el.innerHTML = `<p class="prog">Dùng nút ▲ ▼ để đưa về đúng thứ tự. Xong bấm «Kiểm tra».</p><div class="sortl">${ord.map((x, k) => `<div class="it" data-k="${k}"><b>${k + 1}.</b><span>${esc(x.t)}</span>${lock ? "" : `<button class="btn ghost sm" data-u="${k}">▲</button><button class="btn ghost sm" data-d="${k}">▼</button>`}</div>`).join("")}</div>${lock ? "" : `<div class="row" style="margin-top:12px"><button class="btn ok" id="chk">Kiểm tra</button></div>`}`;
    if (lock) return;
    el.querySelectorAll("[data-u]").forEach(b => b.onclick = () => { const k = +b.dataset.u; if (k > 0) { [ord[k - 1], ord[k]] = [ord[k], ord[k - 1]]; draw(); } });
    el.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { const k = +b.dataset.d; if (k < ord.length - 1) { [ord[k + 1], ord[k]] = [ord[k], ord[k + 1]]; draw(); } });
    $("#chk").onclick = () => {
      draw(true); let d = 0;
      el.querySelectorAll(".it").forEach((r, k) => { const ok = ord[k].i === k; if (ok) d++; r.classList.add(ok ? "ok" : "bad"); });
      if (d < ord.length) S.sai.push("Sắp xếp: " + it.q.slice(0, 50));
      thDone(it, d, ord.length, `Đúng vị trí ${d}/${ord.length}. Thứ tự đúng: ${it.items.map(esc).join(" → ")}`);
    };
  };
  draw(false);
}

/* ---------- tổng kết + ghi vết ---------- */
function finish() {
  stopTimer();
  let dat = 0, toi = 0; S.vongs.forEach(k => { dat += S.diem[k]; toi += S.toi[k]; });
  const thang10 = toi ? Math.round(dat / toi * 100) / 10 : 0;
  const rec = { rid: BAI.id + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7), bai: BAI.id, ten: BAI.ten, ma: S.ma || (S.doi ? "THI-DOI" : ""), luc: new Date().toISOString(), giay: Math.round((Date.now() - S.bat) / 1000),
    diem10: thang10, vong: Object.fromEntries(S.vongs.map(k => [k, `${Math.round(S.diem[k] * 100) / 100}/${S.toi[k]}`])),
    doi: S.doi ? S.doi.map(t => t.ten + ": " + Math.round(t.d * 100) / 100) : null, sai: S.sai.slice(0, 40), het: S.het };
  const log = lsGet(LOGKEY, []); log.push(rec); lsSet(LOGKEY, log.slice(-500));
  teamBar();
  const msg = thang10 >= 8 ? "Xuất sắc! 🏆" : thang10 >= 6.5 ? "Tốt lắm! 👍" : thang10 >= 5 ? "Đạt — ôn thêm chỗ sai nhé 💪" : "Cần ôn lại — chơi thêm lượt nữa nhé 📚";
  const xh = S.doi ? S.doi.slice().sort((a, b) => b.d - a.d) : null;
  app.innerHTML = `<div class="card"><h2 style="text-align:center;margin:0">Tổng kết</h2>
    ${xh ? `<div class="big-emoji">🏆</div><h2 style="text-align:center">${esc(xh[0].ten)} dẫn đầu</h2><table><tr><th>Hạng</th><th>Đội</th><th>Điểm</th></tr>${xh.map((t, i) => `<tr><td>${i + 1}</td><td>${esc(t.ten)}</td><td>${Math.round(t.d * 100) / 100}</td></tr>`).join("")}</table>` :
      `<div class="score">${thang10.toString().replace(".", ",")}</div><p style="text-align:center;font-size:20px">${msg}</p>`}
    <table style="margin-top:12px"><tr><th>Vòng</th><th>Kết quả</th></tr>${S.vongs.map(k => `<tr><td>${VONG.find(v => v.k === k).ten}</td><td>${Math.round(S.diem[k] * 100) / 100} / ${S.toi[k]}</td></tr>`).join("")}</table>
    ${S.sai.length ? `<details style="margin-top:12px"><summary>Các ý cần ôn lại (${S.sai.length})</summary><ul>${S.sai.map(s => `<li>${esc(s)}</li>`).join("")}</ul></details>` : ""}
    <p class="prog" id="gui">${S.ma ? "Đang lưu kết quả…" : "Kết quả đã lưu trên máy này (📒 Lịch sử)."}</p>
    <div class="row"><button class="btn acc" id="again">🔁 Chơi lượt mới</button><button class="btn ghost" id="hm">Về đầu</button></div></div>`;
  $("#again").onclick = () => start(S.vongs, S.het, S.ma, S.doi ? S.doi.map(t => t.ten) : []);
  $("#hm").onclick = home;
  send(rec);
}

/* Gửi kết quả — giống các bài tập của Đấu trường:
   lưu ngay trên máy (hàng chờ), có mạng thì tự gửi; mất mạng giữa chừng không mất bài.
   Mỗi lượt có mã riêng (rid) để bảng điểm không ghi trùng khi gửi lại. */
const GUI_URL = BAI.gui_url || "";
/* Gói kết quả theo đúng mẫu ACTIVITY_RESULTS của Đấu trường: mode «review» = Ôn tập (chuyên cần tính riêng). */
function goiDauTruong(r) {
  const parts = Object.values(r.vong || {}).map(v => String(v).split("/").map(Number));
  const dat = parts.reduce((a, x) => a + (x[0] || 0), 0), toi = parts.reduce((a, x) => a + (x[1] || 0), 0);
  return { eventId: r.rid, mode: "review", subject: BAI.mon, grade: Number(BAI.khoi || 6), lessonId: BAI.id, lessonNo: 0,
    lessonTitle: BAI.ten, studentId: r.ma, score: r.diem10, correct: Math.round(dat), total: toi,
    durationSeconds: r.giay, startedAtMs: Date.parse(r.luc) - r.giay * 1000 };
}
function send(rec) {
  if (!rec.ma || rec.ma === "THI-DOI") { flush(); return; }          // thi đội: chỉ lưu trên máy
  const q = lsGet(QKEY, []); q.push(rec); lsSet(QKEY, q.slice(-300)); flush();
}
function trangThai(t) { const g = $("#gui"); if (g) g.textContent = t; }
let dangGui = false;
async function flush() {
  const q = lsGet(QKEY, []);
  const choGui = q.length;
  if (!choGui) return;
  const gs = window.google && google.script && google.script.run;   // mở ngay trong Web App Đấu trường
  if (!GUI_URL && !gs) { trangThai("✔ Đã lưu kết quả."); return; }
  if (!navigator.onLine) { trangThai("✔ Đã lưu kết quả."); return; }
  if (dangGui) return; dangGui = true;
  const con = [];
  for (const r of q) {
    try {
      const goi = goiDauTruong(r);
      if (gs) await new Promise((ok, loi) => google.script.run.withSuccessHandler(x => (x && x.ok === false) ? loi(new Error(x.message)) : ok(x)).withFailureHandler(loi).saveArenaOfflineResult(goi));
      else await fetch(GUI_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "ontap_result", data: goi }) });
      const log = lsGet(LOGKEY, []); const x = log.find(y => y.rid === r.rid); if (x) { x.da_gui = new Date().toISOString(); lsSet(LOGKEY, log); }
    } catch (e) { con.push(r); }
  }
  const moi = lsGet(QKEY, []).filter(r => !q.some(y => y.rid === r.rid));   // lượt mới thêm trong lúc gửi
  lsSet(QKEY, con.concat(moi)); dangGui = false;
  trangThai("✔ Đã lưu kết quả.");
}
addEventListener("message", e => { if (e.data && e.data.type === "ONTAP_ACK" && e.data.rid) lsSet(QKEY, lsGet(QKEY, []).filter(r => r.rid !== e.data.rid)); });
setInterval(flush, 30000); setTimeout(flush, 1500);
document.addEventListener("visibilitychange", () => { if (!document.hidden) flush(); });
if ("serviceWorker" in navigator && location.protocol.startsWith("http") && !(window.google && google.script)) navigator.serviceWorker.register("sw.js").catch(() => {});

/* ---------- lịch sử trên máy (cho giáo viên) ---------- */
$("#btnLog").onclick = () => {
  stopTimer();
  const log = lsGet(LOGKEY, []).slice().reverse();
  app.innerHTML = `<div class="card"><div class="row"><h2 style="margin:0">📒 Lịch sử lượt chơi trên máy này (${log.length})</h2><span class="grow"></span><button class="btn sm" id="csv">Tải CSV</button><button class="btn sm ghost" id="hm">Đóng</button></div>
    <div style="overflow:auto;margin-top:10px"><table><tr><th>Lúc</th><th>Mã / Đội</th><th>Điểm /10</th><th>Từng vòng</th><th>Thời gian</th><th>Ý sai</th><th>Gửi</th></tr>
    ${log.map(r => `<tr><td>${new Date(r.luc).toLocaleString("vi-VN")}</td><td>${esc(r.ma || "—")}${r.doi ? "<br>" + r.doi.map(esc).join("<br>") : ""}</td><td><b>${r.diem10}</b></td><td>${Object.entries(r.vong).map(([k, v]) => k.toUpperCase() + " " + v).join("<br>")}</td><td>${Math.floor(r.giay / 60)}′${r.giay % 60}″</td><td>${r.sai.length}</td><td>${r.da_gui ? "✔" : (r.ma && r.ma !== "THI-DOI" ? "⏳" : "—")}</td></tr>`).join("")}</table></div>
    <div class="row" style="margin-top:10px"><button class="btn sm ghost" id="xoa">Xoá lịch sử trên máy</button></div></div>`;
  $("#hm").onclick = home;
  $("#xoa").onclick = () => { if (confirm("Xoá toàn bộ lịch sử lượt chơi trên máy này?")) { lsSet(LOGKEY, []); $("#btnLog").click(); } };
  $("#csv").onclick = () => {
    const rows = [["luc", "ma", "diem10", "vong", "giay", "so_y_sai", "y_sai"]].concat(log.map(r => [r.luc, r.ma, r.diem10, Object.entries(r.vong).map(([k, v]) => k + " " + v).join(" | "), r.giay, r.sai.length, r.sai.join(" | ")]));
    const csv = "﻿" + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = BAI.id + "_lich-su.csv"; a.click();
  };
};

home();
</script>
